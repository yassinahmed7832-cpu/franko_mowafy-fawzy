
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="MOWAFY BLACK LABEL - Franco Pro V6 Smart Translator">
<meta name="google-site-verification" content="o0NdwSYvTfj9_u3r9lhDtEvmmGWwJUzsNocl1-WVVBo">
<title>MOWAFY | FRANCO PRO V6</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
:root{--gold:#d6b56d;--bg:#080808;--panel:#121212;--muted:#999}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#242016 0,#080808 48%);color:#fff;font-family:'Cairo',sans-serif;min-height:100vh;padding:25px 15px}
.container{max-width:760px;margin:auto}
header{text-align:center;padding:24px 10px}
.brand{font-size:15px;letter-spacing:5px;color:var(--gold);font-weight:800}
h1{font-size:clamp(30px,7vw,48px);margin:8px 0 0;font-weight:900}
h1 span{color:var(--gold)}
.subtitle{color:#aaa;font-size:13px;letter-spacing:2px}
.card{background:linear-gradient(145deg,#171717,#0d0d0d);border:1px solid #393020;border-radius:22px;padding:22px;margin-top:20px;box-shadow:0 15px 45px #0008}
.section-title{color:var(--gold);font-size:15px;font-weight:800;margin:0 0 15px}
textarea{width:100%;min-height:155px;background:#080808;border:1px solid #393939;border-radius:14px;color:#fff;padding:16px;font-family:inherit;font-size:17px;resize:vertical;outline:none}
textarea:focus{border-color:var(--gold)}
textarea::placeholder{color:#666}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:14px;transition:.2s}
button:active{transform:scale(.97)}
.primary{background:linear-gradient(135deg,#f0d28a,#aa8540);color:#090909;flex:1}
.secondary{background:#252525;color:#eee;border:1px solid #444;flex:1}
.result{background:#080808;border:1px solid #393020;border-radius:14px;padding:18px;min-height:100px;font-size:18px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere}
.small{color:var(--muted);font-size:12px;margin-top:10px}
.direction{display:flex;gap:10px;margin-bottom:15px}
.direction button{flex:1;background:#242424;color:#aaa;border:1px solid #444}
.direction button.active{background:#d6b56d;color:#111;border-color:#d6b56d}
.word-row{display:flex;gap:8px;margin-top:12px}
.word-row input{min-width:0;flex:1;background:#080808;border:1px solid #444;border-radius:10px;padding:12px;color:white;font-family:inherit}
.word-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.word{background:#242016;border:1px solid #66532e;color:#e6c77f;padding:7px 11px;border-radius:9px;font-size:13px}
footer{text-align:center;color:#777;font-size:12px;padding:30px 10px}
footer b{color:var(--gold)}
</style>
</head>
<body>
<div class="container">
<header>
<div class="brand">M O W A F Y</div>
<h1>FRANCO <span>PRO</span> V6</h1>
<div class="subtitle">BLACK LABEL • SMART TRANSLATOR</div>
</header>

<div class="card">
<p class="section-title">01 — TRANSLATION STUDIO</p>
<div class="direction">
<button id="toFranco" class="active" onclick="setMode('franco')">عربي ← فرانكو</button>
<button id="toArabic" onclick="setMode('arabic')">فرانكو ← عربي</button>
</div>
<textarea id="source" placeholder="اكتب النص هنا..."></textarea>
<div class="actions">
<button class="primary" onclick="translateText()">ترجم الآن ✦</button>
<button class="secondary" onclick="clearAll()">مسح</button>
</div>
<p class="section-title" style="margin-top:24px">02 — RESULT</p>
<div class="result" id="result">النتيجة هتظهر هنا...</div>
<div class="actions">
<button class="secondary" onclick="copyResult()">نسخ النتيجة</button>
</div>
<div class="small" id="status"></div>
</div>

<div class="card">
<p class="section-title">03 — PERSONAL DICTIONARY</p>
<div class="word-row">
<input id="wordArabic" placeholder="الكلمة بالعربي">
<input id="wordFranco" placeholder="بالفرانكو">
</div>
<div class="actions">
<button class="primary" onclick="addWord()">إضافة للقاموس +</button>
</div>
<div class="word-list" id="wordList"></div>
<p class="small">الكلمات المضافة تُحفظ على نفس الجهاز والمتصفح.</p>
</div>

<footer>
<b>MOWAFY</b> © 2026 — FRANCO PRO V6<br>
BLACK LABEL EDITION
</footer>
</div>

<script>
let mode='franco';

const base={
'ا':'a','أ':'a','إ':'e','آ':'2a','ب':'b','ت':'t','ث':'th',
'ج':'g','ح':'7','خ':'5','د':'d','ذ':'th','ر':'r','ز':'z',
'س':'s','ش':'sh','ص':'9','ض':'9\'','ط':'6','ظ':'6\'',
'ع':'3','غ':'8','ف':'f','ق':'2','ك':'k','ل':'l','م':'m',
'ن':'n','ه':'h','ة':'a','و':'w','ي':'y','ى':'a','ء':'2'
};

let custom={};
try{custom=JSON.parse(localStorage.getItem('mowafyDictionary')||'{}')}catch(e){custom={}}

function setMode(value){
 mode=value;
 document.getElementById('toFranco').classList.toggle('active',mode==='franco');
 document.getElementById('toArabic').classList.toggle('active',mode==='arabic');
 document.getElementById('source').placeholder=mode==='franco'?'اكتب بالعربي هنا...':'Write in Franco here...';
 document.getElementById('result').textContent='النتيجة هتظهر هنا...';
}

function translateText(){
 const input=document.getElementById('source').value.trim();
 if(!input){document.getElementById('status').textContent='اكتب نص الأول';return}
 let output='';
 if(mode==='franco'){
  for(const ch of input){
   output+=custom[ch]||base[ch]||ch;
  }
 }else{
  const reverse={};
  for(const [ar,fr] of Object.entries(base)) reverse[fr]=ar;
  for(const [ar,fr] of Object.entries(custom)) reverse[fr]=ar;
  const tokens=Object.keys(reverse).sort((a,b)=>b.length-a.length);
  let i=0;
  while(i<input.length){
   let found=false;
   for(const token of tokens){
    if(input.slice(i,i+token.length).toLowerCase()===token.toLowerCase()){
     output+=reverse[token];i+=token.length;found=true;break;
    }
   }
   if(!found){output+=input[i];i++}
  }
 }
 document.getElementById('result').textContent=output;
 document.getElementById('status').textContent='تمت العملية بنجاح';
}

function clearAll(){
 document.getElementById('source').value='';
 document.getElementById('result').textContent='النتيجة هتظهر هنا...';
 document.getElementById('status').textContent='';
}

function copyResult(){
 const text=document.getElementById('result').textContent;
 if(!text||text==='النتيجة هتظهر هنا...')return;
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(()=>document.getElementById('status').textContent='تم النسخ ✓').catch(()=>fallbackCopy(text));
 }else fallbackCopy(text);
}

function fallbackCopy(text){
 const area=document.createElement('textarea');
 area.value=text;document.body.appendChild(area);area.select();
 try{document.execCommand('copy');document.getElementById('status').textContent='تم النسخ ✓'}catch(e){document.getElementById('status').textContent='تعذر النسخ'}
 area.remove();
}

function addWord(){
 const ar=document.getElementById('wordArabic').value.trim();
 const fr=document.getElementById('wordFranco').value.trim();
 if(!ar||!fr){alert('اكتب الكلمة باللغتين');return}
 custom[ar]=fr;
 localStorage.setItem('mowafyDictionary',JSON.stringify(custom));
 document.getElementById('wordArabic').value='';
 document.getElementById('wordFranco').value='';
 renderWords();
}

function renderWords(){
 const list=document.getElementById('wordList');
 list.innerHTML='';
 Object.entries(custom).forEach(([ar,fr])=>{
  const item=document.createElement('span');
  item.className='word';
  item.textContent=ar+' = '+fr;
  list.appendChild(item);
 });
}
renderWords();
</script>
</body>
</html>
