<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRANCO PRO V5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e12;color:white;font-family:Arial;padding:20px}
h2{text-align:center;color:#20d1c5}
.card{background:#122027;border:1px solid #29414a;border-radius:22px;padding:20px;margin:18px 0}
label{display:block;color:#35d6d0;margin-bottom:12px;font-size:20px}
textarea,input{width:100%;background:#091217;color:white;border:1px solid #38515a;border-radius:16px;padding:17px;font-size:22px;margin-bottom:15px}
textarea{height:145px;resize:vertical}
button{width:100%;padding:17px;border:0;border-radius:16px;background:#18bdb2;color:#061416;font-size:21px;font-weight:bold;margin:7px 0}
.secondary{background:#20353c;color:#35d6d0}
#result{font-size:27px;min-height:65px;line-height:1.7;overflow-wrap:anywhere}
#status{color:#38d6b4;text-align:center;margin-top:12px}
</style>
</head>
<body>
<h2>FRANCO PRO V5</h2>
<h2>SMART TRANSLATOR</h2>

<div class="card">
<label>اكتب الفرانكو هنا</label>
<textarea id="source" placeholder="مثال: ezayak ya 7abibi"></textarea>
<button id="translate">ترجم للعربي</button>
</div>

<div class="card">
<label>الترجمة العربية</label>
<div id="result">الترجمة هتظهر هنا...</div>
<button id="copy">نسخ الترجمة</button>
<button class="secondary" id="clear">مسح النص</button>
<div id="status"></div>
</div>

<div class="card">
<label>إضافة كلمة جديدة للقاموس</label>
<input id="word" placeholder="كلمة فرانكو">
<input id="meaning" placeholder="معناها بالعربي">
<button id="save">حفظ الكلمة</button>
</div>

<script>
const dict = {
"ezayak":"إزيك","ezayek":"إزيك",
"ezzayak":"إزيك","ya":"يا",
"7abibi":"حبيبي","7abibti":"حبيبتي",
"ana":"أنا","enta":"أنت",
"enty":"أنتي","a5oya":"أخويا",
"akhoya":"أخويا","gamdan":"جامد",
"game":"جيم","el":"ال",
"3ayez":"عايز","3ayza":"عايزة",
"aroo7":"أروح","bokra":"بكرة",
"mashy":"ماشي","tamam":"تمام",
"7elw":"حلو","kwayes":"كويس",
"habibi":"حبيبي","sabah":"صباح",
"masa":"مساء","noor":"نور",
"allah":"الله","7amdullah":"الحمد لله",
"shokran":"شكرا","3afwan":"عفوا",
"mesh":"مش","la2":"لأ",
"ah":"آه","aywa":"أيوه",
"bas":"بس","leh":"ليه",
"emta":"إمتى","feen":"فين",
"meen":"مين","eh":"إيه",
"da":"ده","di":"دي",
"enta 3amel eh":"أنت عامل إيه",
"ana tamam":"أنا تمام",
"7abibi":"حبيبي"
};

try {
Object.assign(dict,JSON.parse(localStorage.getItem("franco_words")||"{}"));
} catch(e) {}

function convertWord(w){
 let key=w.toLowerCase();
 if(dict[key]) return dict[key];

 let s=key.replace(/sh/g,"ش")
 .replace(/kh/g,"خ")
 .replace(/gh/g,"غ")
 .replace(/th/g,"ث")
 .replace(/dh/g,"ذ")
 .replace(/ch/g,"تش")
 .replace(/ph/g,"ف");

 const chars={
 "2":"ء","3":"ع","5":"خ","6":"ط","7":"ح","8":"غ","9":"ص",
 "a":"ا","b":"ب","c":"ك","d":"د","e":"ي",
 "f":"ف","g":"ج","h":"ه","i":"ي","j":"ج",
 "k":"ك","l":"ل","m":"م","n":"ن","o":"و",
 "p":"ب","q":"ق","r":"ر","s":"س","t":"ت",
 "u":"و","v":"ف","w":"و","x":"كس","y":"ي","z":"ز"
 };
 return s.split("").map(c=>chars[c]??c).join("");
}

function translate(text){
 let key=text.toLowerCase().trim();
 if(dict[key]) return dict[key];

 return text.split(/([A-Za-z0-9]+)/g)
 .map(part=>/^[A-Za-z0-9]+$/.test(part)?convertWord(part):part)
 .join("");
}

document.getElementById("translate").onclick=function(){
 let text=document.getElementById("source").value.trim();
 let result=document.getElementById("result");
 let status=document.getElementById("status");

 if(!text){
 status.textContent="اكتب الفرانكو الأول";
 return;
 }
 result.textContent=translate(text);
 status.textContent="تمت الترجمة بنجاح";
};

document.getElementById("copy").onclick=async function(){
 let text=document.getElementById("result").textContent;
 try{
 await navigator.clipboard.writeText(text);
 document.getElementById("status").textContent="تم النسخ بنجاح";
 }catch(e){
 document.getElementById("status").textContent="حدد الترجمة وانسخها يدويا";
 }
};

document.getElementById("clear").onclick=function(){
 document.getElementById("source").value="";
 document.getElementById("result").textContent="الترجمة هتظهر هنا...";
 document.getElementById("status").textContent="";
};

document.getElementById("save").onclick=function(){
 let w=document.getElementById("word").value.trim().toLowerCase();
 let m=document.getElementById("meaning").value.trim();
 if(!w||!m){
 document.getElementById("status").textContent="اكتب الكلمة ومعناها";
 return;
 }
 dict[w]=m;
 localStorage.setItem("franco_words",JSON.stringify(dict));
 document.getElementById("status").textContent="تم حفظ الكلمة";
 document.getElementById("word").value="";
 document.getElementById("meaning").value="";
};
</script>
</body>
</html>
